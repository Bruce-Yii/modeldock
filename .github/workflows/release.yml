name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # dist/ is gitignored (not committed) but test/install-mock.test.mjs and the
      # build artifact need the built bundle, so build before testing.
      - run: npm run build
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
      - name: Generate checksums
        run: cd dist && sha256sum modeldock.mjs > SHA256SUMS && cat SHA256SUMS
      # Re-tagging an existing version must refresh its assets rather than fail:
      # `gh release create` errors when the release already exists, so upload with
      # --clobber in that case (release notes are kept).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="dist/modeldock.mjs dist/SHA256SUMS scripts/install.ps1 scripts/install.sh"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists - replacing its assets"
            gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber
          else
            gh release create "$GITHUB_REF_NAME" $ASSETS \
              --title "ModelDock $GITHUB_REF_NAME" \
              --generate-notes
          fi
